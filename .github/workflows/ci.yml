name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  TRADINGAGENTS_DISABLE_DOTENV: "1"
  NO_PROXY: "127.0.0.1,localhost,::1"
  no_proxy: "127.0.0.1,localhost,::1"

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependency manager
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.11.19"

      - name: Verify frozen dependency lock
        run: python -m uv lock --check

      - name: Sync exact test and production dependencies
        run: >-
          python -m uv sync
          --frozen
          --extra dev
          --extra production
          --no-editable

      - name: Compile
        run: .venv/bin/python -m compileall -q cli tradingagents tests

      - name: Test
        run: .venv/bin/python -m pytest -q

      - name: Build wheel and source distribution
        run: .venv/bin/python -m build

      - name: Verify distribution resources
        run: .venv/bin/python scripts/verify_distribution.py dist/*

      - name: Smoke-test installed wheel outside the source tree
        run: |
          python -m uv pip install \
            --python .venv/bin/python \
            --no-deps \
            --reinstall \
            dist/*.whl
          cd /tmp
          PYTHONPATH="" "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/installed_package_smoke.py" \
            --forbid-root "$GITHUB_WORKSPACE"

  image-build:
    name: Production image build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build production image from frozen lock
        run: docker build --tag iic-forge:ci .

      - name: Smoke-test production image
        run: |
          docker run --rm iic-forge:ci --help
          docker run --rm \
            --entrypoint python \
            --volume "$PWD:/workspace:ro" \
            iic-forge:ci \
            /workspace/scripts/installed_package_smoke.py \
            --forbid-root /workspace
          docker run --rm \
            --entrypoint python \
            iic-forge:ci \
            -c "from tradingagents.sensing.embeddings import SentenceTransformerEmbedder; e = SentenceTransformerEmbedder(); e.load(); assert len(e.embed('health check')) == 384"

  quality-baseline:
    name: Non-blocking quality baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: python -m pip install ruff==0.6.9 mypy==1.11.2

      - name: Ruff baseline
        continue-on-error: true
        run: ruff check .

      - name: Mypy baseline
        continue-on-error: true
        run: >-
          mypy
          --ignore-missing-imports
          --follow-imports=skip
          tradingagents
          cli
