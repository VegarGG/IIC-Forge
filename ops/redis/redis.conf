# Canonical IIC-Forge Redis configuration, mounted by docker-compose.yml.
#
# Adapters issue Redis 7.2+ WAITAOF after each XADD and advance their SQLite
# cursor only after the local AOF confirms an fsync. appendfsync remains
# everysec so unrelated Redis operations are not forced individually.

appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
maxmemory 256mb
maxmemory-policy noeviction
save ""
dir /data
# Redis has no published host port and is reachable only on the Compose bridge.
# Protected mode would reject the non-loopback application containers because
# this private deployment intentionally does not configure Redis authentication.
protected-mode no
port 6379
timeout 0
tcp-keepalive 60
